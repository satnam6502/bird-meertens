<svg xmlns="http://www.w3.org/2000/svg" width="811.4" height="297.0" viewBox="0 0 811.4 297.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">A byte at a time, through the bit-serial LFSR</title>
<desc id="desc">A byte at a time, through the bit-serial LFSR. The circuit of the line toPoly ∘ foldl (lfsrStep 0x1021) 0 ∘ flatten ∘ map bitsOf. bitsOf turns each byte into eight bits, most significant first: eight clocks a byte. Folding over the bytes in turn, as foldl (foldl (lfsrStep 0x1021)) 0, changes nothing here.</desc>
