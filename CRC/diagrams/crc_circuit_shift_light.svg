<title id="title">Shift fusion: the shift moves into the loop</title>
<desc id="desc">Shift fusion: the shift moves into the loop. The circuit of the line (· %ₘ g) ∘ foldl (hornerShift 8) 0. Each bit enters at X⁸, so the register grows to n + 8 coefficients.</desc>
