<svg xmlns="http://www.w3.org/2000/svg" width="788.0" height="297.0" viewBox="0 0 788.0 297.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Horner's rule: a loop, but its state grows</title>
<desc id="desc">Horner's rule: a loop, but its state grows. The circuit of the line (· %ₘ g) ∘ (· * X⁸) ∘ foldl horner 0. Each message bit b enters the step, and the register keeps the result. After the last bit, p is the whole message polynomial.</desc>
