<title id="title">Sarwate's table: one lookup a byte</title>
<desc id="desc">Sarwate's table: one lookup a byte. The circuit of the line toPoly ∘ foldl (tableStep (table 0x1021)) 0. table i = byteStep 0x1021 0 i, computed once: 256 entries of 16 bits. Reduction modulo g is linear, which is why one lookup can stand for eight clocks.</desc>
