<svg xmlns="http://www.w3.org/2000/svg" width="447.9" height="308.0" viewBox="0 0 447.9 308.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Horner's rule: msgPoly = foldl horner 0</title>
<desc id="desc">Horner's rule: msgPoly = foldl horner 0. Starting from [1, 0, 1, 1], the line before the step: msgPoly gives X³ + X + 1. The line after: foldl horner 0 gives (((0·X + 1)·X + 0)·X + 1)·X + 1 = X³ + X + 1.</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Horner's rule</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">msgPoly = foldl horner 0</tspan></text>
<line x1="167.0" y1="114.0" x2="69.9" y2="170.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="63.0,174.0 73.9,172.9 69.4,165.1" fill="#52514e"/>
<text x="110.0" y="134.1" text-anchor="end" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">msgPoly</tspan></text>
<line x1="199.0" y1="114.0" x2="296.1" y2="170.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="303.0,174.0 296.6,165.1 292.1,172.9" fill="#52514e"/>
<text x="256.0" y="134.1" text-anchor="start" textLength="109.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">foldl horner 0</tspan></text>
<text x="183.0" y="106.0" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="63.0" y="190.0" text-anchor="middle" textLength="78.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#0b0b0b">X³ + X + 1</tspan></text>
<text x="303.0" y="190.0" text-anchor="middle" textLength="241.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#0b0b0b">(((0·X + 1)·X + 0)·X + 1)·X + 1</tspan></text>
<text x="303.0" y="210.0" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">= </tspan><tspan fill="#0b0b0b">X³ + X + 1</tspan></text>
<text x="142.1" y="190.0" text-anchor="middle" textLength="7.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">=</tspan></text>
<rect x="24.0" y="248.0" width="226.8" height="36.0" rx="4" fill="#f0efec" stroke="#e1e0d9"/>
<text x="36.0" y="270.0" text-anchor="start" textLength="202.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">where </tspan><tspan fill="#0b0b0b">horner p b = p·X + b</tspan></text>
</g>
</svg>
