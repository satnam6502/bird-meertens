<svg xmlns="http://www.w3.org/2000/svg" width="820.0" height="380.0" viewBox="0 0 820.0 380.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Data refinement: an 8-bit LFSR, which is crc8.sv</title>
<desc id="desc">Data refinement: an 8-bit LFSR, which is crc8.sv. The circuit of the line toPoly ∘ foldl (lfsrStep 0x07) 0. The taps are the bits of 0x07, found by running lfsrStep on each unit input. Bit rᵢ holds the coefficient of Xⁱ. Each clock shifts the register up one bit. crc8.sv has exactly these gates: crc8Next_eq_lfsrStep proves it.</desc>
