<svg xmlns="http://www.w3.org/2000/svg" width="610.4" height="272.0" viewBox="0 0 610.4 272.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The specification: the whole message at once</title>
<desc id="desc">The specification: the whole message at once. The circuit of the line (· %ₘ g) ∘ (· * X⁸) ∘ msgPoly. The label on each wire counts the coefficients it carries. Nothing is computed until the whole message has arrived.</desc>
