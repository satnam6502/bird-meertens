<text x="24.0" y="60.0" text-anchor="start" textLength="226.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">(· %ₘ g) ∘ (· * X⁸) ∘ msgPoly</tspan></text>
