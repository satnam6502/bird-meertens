<svg xmlns="http://www.w3.org/2000/svg" width="422.8" height="476.0" viewBox="0 0 422.8 476.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Horner's rule: maxL ∘ map sum ∘ tails = foldl (⊙) 0</title>
<desc id="desc">Horner's rule: maxL ∘ map sum ∘ tails = foldl (⊙) 0. Starting from [3, −4, 2], the line before the step: tails gives [[3, −4, 2], [−4, 2], [2], []], then map sum gives [1, −2, 2, 0], then maxL gives 2. The line after: foldl (⊙) 0 gives ((0 ⊙ 3) ⊙ −4) ⊙ 2 = 2.</desc>
<rect width="100%" height="100%" fill="#1a1a19"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#ffffff">Horner's rule</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="280.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">maxL ∘ map sum ∘ tails = foldl (⊙) 0</tspan></text>
<line x1="274.0" y1="114.0" x2="249.4" y2="166.8" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="246.0,174.0 254.3,166.8 246.2,163.0" fill="#c3c2b7"/>
<text x="250.9" y="141.2" text-anchor="end" textLength="39.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">tails</tspan></text>
<line x1="141.0" y1="198.0" x2="141.0" y2="250.0" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="141.0,258.0 145.5,248.0 136.5,248.0" fill="#c3c2b7"/>
<text x="131.0" y="232.0" text-anchor="end" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map sum</tspan></text>
<line x1="141.0" y1="282.0" x2="141.0" y2="334.0" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="141.0,342.0 145.5,332.0 136.5,332.0" fill="#c3c2b7"/>
<text x="131.0" y="316.0" text-anchor="end" textLength="31.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">maxL</tspan></text>
<line x1="301.0" y1="114.0" x2="301.0" y2="334.0" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="301.0,342.0 305.5,332.0 296.5,332.0" fill="#c3c2b7"/>
<text x="311.0" y="232.0" text-anchor="start" textLength="85.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">foldl (⊙) 0</tspan></text>
<text x="301.0" y="106.0" text-anchor="middle" textLength="78.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#3987e5">[</tspan><tspan fill="#ffffff">3</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">−4</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">2</tspan><tspan fill="#3987e5">]</tspan></text>
<text x="141.0" y="190.0" text-anchor="middle" textLength="234.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#d95926">[</tspan><tspan fill="#3987e5">[</tspan><tspan fill="#ffffff">3</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">−4</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">2</tspan><tspan fill="#3987e5">]</tspan><tspan fill="#d95926">, </tspan><tspan fill="#3987e5">[</tspan><tspan fill="#ffffff">−4</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">2</tspan><tspan fill="#3987e5">]</tspan><tspan fill="#d95926">, </tspan><tspan fill="#3987e5">[</tspan><tspan fill="#ffffff">2</tspan><tspan fill="#3987e5">]</tspan><tspan fill="#d95926">, </tspan><tspan fill="#3987e5">[]</tspan><tspan fill="#d95926">]</tspan></text>
<text x="141.0" y="274.0" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#3987e5">[</tspan><tspan fill="#ffffff">1</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">−2</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">2</tspan><tspan fill="#3987e5">, </tspan><tspan fill="#ffffff">0</tspan><tspan fill="#3987e5">]</tspan></text>
<text x="141.0" y="358.0" text-anchor="middle" textLength="7.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffffff">2</tspan></text>
<text x="301.0" y="358.0" text-anchor="middle" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffffff">((0 ⊙ 3) ⊙ −4) ⊙ 2</tspan></text>
<text x="301.0" y="378.0" text-anchor="middle" textLength="23.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">= </tspan><tspan fill="#ffffff">2</tspan></text>
<text x="187.9" y="358.0" text-anchor="middle" textLength="7.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">=</tspan></text>
<rect x="24.0" y="416.0" width="234.6" height="36.0" rx="4" fill="#252524" stroke="#383835"/>
<text x="36.0" y="438.0" text-anchor="start" textLength="210.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">where </tspan><tspan fill="#ffffff">a ⊙ b = max (a + b) 0</tspan></text>
</g>
</svg>
