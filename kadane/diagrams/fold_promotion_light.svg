<svg xmlns="http://www.w3.org/2000/svg" width="523.5" height="319.0" viewBox="0 0 523.5 319.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Fold promotion: maxL ∘ concat = maxL ∘ map maxL</title>
<desc id="desc">Fold promotion: maxL ∘ concat = maxL ∘ map maxL. Starting from [[0], [3, 0], [−1, −4, 0], [1, −2, 2, 0]], the line before the step: concat gives [0, 3, 0, −1, −4, 0, 1, −2, 2, 0], then maxL gives 3. The line after: map maxL gives [0, 3, 0, 2], then maxL gives 3.</desc>
