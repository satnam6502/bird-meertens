<svg xmlns="http://www.w3.org/2000/svg" width="899.4" height="386.4" viewBox="0 0 899.4 386.4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Map promotion: map f ∘ concat = concat ∘ map (map f)</title>
<desc id="desc">Map promotion: map f ∘ concat = concat ∘ map (map f). Starting from [[[]], [[3], []], [[3, −4], [−4], []], [[3, −4, 2], [−4, 2], [2], []]], the line before the step: concat gives [[], [3], [], [3, −4], [−4], [], [3, −4, 2], [−4, 2], [2], []], then map sum gives [0, 3, 0, −1, −4, 0, 1, −2, 2, 0]. The line after: map (map sum) gives [[0], [3, 0], [−1, −4, 0], [1, −2, 2, 0]], then concat gives [0, 3, 0, −1, −4, 0, 1, −2, 2, 0].</desc>
