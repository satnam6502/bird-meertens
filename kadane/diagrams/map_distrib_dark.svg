<polygon points="297.0,258.0 301.5,248.0 292.5,248.0" fill="#c3c2b7"/>
<text x="287.0" y="232.0" text-anchor="end" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map (map sum)</tspan></text>
<line x1="297.0" y1="282.0" x2="297.0" y2="334.0" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="297.0,342.0 301.5,332.0 292.5,332.0" fill="#c3c2b7"/>
<text x="287.0" y="316.0" text-anchor="end" textLength="62.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map maxL</tspan></text>
