<polygon points="351.8,354.0 361.8,349.5 361.8,358.5" fill="#c3c2b7"/>
<text x="606.8" y="232.0" text-anchor="start" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map (maxL ∘ map sum ∘ tails)</tspan></text>
