<svg xmlns="http://www.w3.org/2000/svg" width="851.2" height="396.0" viewBox="0 0 851.2 396.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Map distributivity: map f ∘ map g = map (f ∘ g)</title>
<desc id="desc">Map distributivity: map f ∘ map g = map (f ∘ g). Starting from [[], [3], [3, −4], [3, −4, 2]], the line before the step: map tails gives [[[]], [[3], []], [[3, −4], [−4], []], [[3, −4, 2], [−4, 2], [2], []]], then map (map sum) gives [[0], [3, 0], [−1, −4, 0], [1, −2, 2, 0]], then map maxL gives [0, 3, 0, 2]. The line after: map (maxL ∘ map sum ∘ tails) gives [0, 3, 0, 2].</desc>
<rect width="100%" height="100%" fill="#1a1a19"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#ffffff">Map distributivity</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="210.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map f ∘ map g = map (f ∘ g)</tspan></text>
<line x1="297.0" y1="114.0" x2="297.0" y2="166.0" stroke="#c3c2b7" stroke-width="1.5"/>
<polygon points="297.0,174.0 301.5,164.0 292.5,164.0" fill="#c3c2b7"/>
<text x="287.0" y="148.0" text-anchor="end" textLength="70.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c3c2b7">map tails</tspan></text>
