<svg xmlns="http://www.w3.org/2000/svg" width="430.8" height="432.0" viewBox="0 0 430.8 432.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">carry = g ∨ (p ∧ c): scanl carry c = scanl ev c ∘ map gp</title>
<desc id="desc">carry = g ∨ (p ∧ c): scanl carry c = scanl ev c ∘ map gp. Starting from [(1, 0), (0, 0), (1, 1)], the line before the step: scanl carry c gives [1, 1, 0, 1]. The line after: map gp gives [(0, 1), (0, 0), (1, 0)], then scanl ev c gives [1, 1, 0, 1].</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#0b0b0b">carry = g ∨ (p ∧ c)</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="273.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl carry c = scanl ev c ∘ map gp</tspan></text>
<line x1="219.0" y1="114.0" x2="219.0" y2="166.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="219.0,174.0 223.5,164.0 214.5,164.0" fill="#52514e"/>
<text x="229.0" y="148.0" text-anchor="start" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">map gp</tspan></text>
<line x1="215.8" y1="198.0" x2="159.2" y2="252.5" stroke="#52514e" stroke-width="1.5"/>
<polygon points="153.4,258.0 163.7,254.3 157.5,247.8" fill="#52514e"/>
<text x="191.5" y="243.5" text-anchor="start" textLength="78.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl ev c</tspan></text>
<line x1="137.4" y1="114.0" x2="137.4" y2="250.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="137.4,258.0 141.9,248.0 132.9,248.0" fill="#52514e"/>
<text x="127.4" y="190.0" text-anchor="end" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl carry c</tspan></text>
<text x="137.4" y="106.0" text-anchor="middle" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(0, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 1)</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="297.4" y="190.0" text-anchor="middle" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">(0, 1)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(0, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="137.4" y="274.0" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">]</tspan></text>
<rect x="24.0" y="312.0" width="382.8" height="96.0" rx="4" fill="#f0efec" stroke="#e1e0d9"/>
<text x="36.0" y="334.0" text-anchor="start" textLength="85.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">where </tspan><tspan fill="#0b0b0b">c = 1</tspan></text>
<text x="36.0" y="354.0" text-anchor="start" textLength="358.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">carry c (a, b) = (a ∧ b) ∨ (c ∧ (a ∨ b))</tspan></text>
<text x="36.0" y="374.0" text-anchor="start" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">gp (a, b) = (a ∧ b, a ⊕ b)</tspan></text>
<text x="36.0" y="394.0" text-anchor="start" textLength="241.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">ev c (g, p) = g ∨ (p ∧ c)</tspan></text>
</g>
</svg>
