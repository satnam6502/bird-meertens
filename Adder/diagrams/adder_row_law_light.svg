<svg xmlns="http://www.w3.org/2000/svg" width="449.4" height="399.0" viewBox="0 0 449.4 399.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The row law: snoc ∘ row fullAdd c = adder (scanl carry c)</title>
<desc id="desc">The row law: snoc ∘ row fullAdd c = adder (scanl carry c). Starting from [(1, 0), (0, 0), (1, 1)], the line before the step: row fullAdd c gives ([0, 1, 0], 1), then snoc gives [0, 1, 0, 1]. The line after: scanl carry c gives [1, 1, 0, 1], then sumBits xs gives [0, 1, 0, 1].</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#0b0b0b">The row law</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="343.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">snoc ∘ row fullAdd c = adder (scanl carry c)</tspan></text>
<line x1="212.6" y1="114.0" x2="85.8" y2="174.1" stroke="#52514e" stroke-width="1.5"/>
<polygon points="78.6,177.5 89.6,177.3 85.7,169.2" fill="#52514e"/>
<text x="141.3" y="135.3" text-anchor="end" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">row fullAdd c</tspan></text>
<line x1="244.6" y1="114.0" x2="371.4" y2="174.1" stroke="#52514e" stroke-width="1.5"/>
<polygon points="378.6,177.5 371.5,169.2 367.6,177.3" fill="#52514e"/>
<text x="315.9" y="135.3" text-anchor="start" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl carry c</tspan></text>
<line x1="78.6" y1="201.5" x2="205.4" y2="261.6" stroke="#52514e" stroke-width="1.5"/>
<polygon points="212.6,265.0 205.5,256.7 201.6,264.8" fill="#52514e"/>
<text x="141.3" y="251.7" text-anchor="end" textLength="31.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">snoc</tspan></text>
<line x1="378.6" y1="201.5" x2="251.8" y2="261.6" stroke="#52514e" stroke-width="1.5"/>
<polygon points="244.6,265.0 255.6,264.8 251.7,256.7" fill="#52514e"/>
<text x="315.9" y="251.7" text-anchor="start" textLength="78.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">sumBits xs</tspan></text>
<text x="228.6" y="106.0" text-anchor="middle" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(0, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 1)</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="78.6" y="193.5" text-anchor="middle" textLength="109.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#0b0b0b">(</tspan><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">]</tspan><tspan fill="#0b0b0b">, 1)</tspan></text>
<text x="378.6" y="193.5" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="228.6" y="281.0" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">]</tspan></text>
<rect x="24.0" y="319.0" width="336.0" height="56.0" rx="4" fill="#f0efec" stroke="#e1e0d9"/>
<text x="36.0" y="341.0" text-anchor="start" textLength="85.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">where </tspan><tspan fill="#0b0b0b">c = 1</tspan></text>
<text x="36.0" y="361.0" text-anchor="start" textLength="312.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">adder net xs = sumBits xs (net xs)</tspan></text>
</g>
</svg>
