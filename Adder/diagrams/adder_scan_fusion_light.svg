<svg xmlns="http://www.w3.org/2000/svg" width="508.8" height="412.0" viewBox="0 0 508.8 412.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Scan fusion: scanl ev c = map fst ∘ scanl (⊛) (c, false)</title>
<desc id="desc">Scan fusion: scanl ev c = map fst ∘ scanl (⊛) (c, false). Starting from [(0, 1), (0, 0), (1, 0)], the line before the step: scanl ev c gives [1, 1, 0, 1]. The line after: scanl (⊛) (c, false) gives [(1, 0), (1, 0), (0, 0), (1, 0)], then map fst gives [1, 1, 0, 1].</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Scan fusion</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="24.0" y="60.0" text-anchor="start" textLength="335.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl ev c = map fst ∘ scanl (⊛) (c, false)</tspan></text>
<line x1="199.2" y1="114.0" x2="199.2" y2="166.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="199.2,174.0 203.7,164.0 194.7,164.0" fill="#52514e"/>
<text x="209.2" y="148.0" text-anchor="start" textLength="156.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl (⊛) (c, false)</tspan></text>
<line x1="169.6" y1="198.0" x2="137.7" y2="251.1" stroke="#52514e" stroke-width="1.5"/>
<polygon points="133.6,258.0 142.6,251.7 134.9,247.1" fill="#52514e"/>
<text x="160.2" y="240.2" text-anchor="start" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">map fst</tspan></text>
<line x1="117.6" y1="114.0" x2="117.6" y2="250.0" stroke="#52514e" stroke-width="1.5"/>
<polygon points="117.6,258.0 122.1,248.0 113.1,248.0" fill="#52514e"/>
<text x="107.6" y="190.0" text-anchor="end" textLength="78.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">scanl ev c</tspan></text>
<text x="117.6" y="106.0" text-anchor="middle" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">(0, 1)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(0, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="282.4" y="190.0" text-anchor="middle" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(0, 0)</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">(1, 0)</tspan><tspan fill="#2a78d6">]</tspan></text>
<text x="117.6" y="274.0" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2a78d6">[</tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">0</tspan><tspan fill="#2a78d6">, </tspan><tspan fill="#0b0b0b">1</tspan><tspan fill="#2a78d6">]</tspan></text>
<rect x="24.0" y="312.0" width="460.8" height="76.0" rx="4" fill="#f0efec" stroke="#e1e0d9"/>
<text x="36.0" y="334.0" text-anchor="start" textLength="85.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">where </tspan><tspan fill="#0b0b0b">c = 1</tspan></text>
<text x="36.0" y="354.0" text-anchor="start" textLength="413.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">(g₁, p₁) ⊛ (g₂, p₂) = (g₂ ∨ (p₂ ∧ g₁), p₁ ∧ p₂)</tspan></text>
<text x="36.0" y="374.0" text-anchor="start" textLength="436.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#52514e">  and </tspan><tspan fill="#0b0b0b">fst (q ⊛ x) = ev (fst q) x, and fst (c, false) = c</tspan></text>
</g>
</svg>
