<svg xmlns="http://www.w3.org/2000/svg" width="505.6" height="372.0" viewBox="0 0 505.6 372.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Definition of scan1: scanl (⊛) (c, false) = scan1 (⊛) ∘ ((c, false) :: ·)</title>
<desc id="desc">Definition of scan1: scanl (⊛) (c, false) = scan1 (⊛) ∘ ((c, false) :: ·). Starting from [(0, 1), (0, 0), (1, 0)], the line before the step: scanl (⊛) (c, false) gives [(1, 0), (1, 0), (0, 0), (1, 0)]. The line after: ((c, false) :: ·) gives [(1, 0), (0, 1), (0, 0), (1, 0)], then scan1 (⊛) gives [(1, 0), (1, 0), (0, 0), (1, 0)].</desc>
